<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <link rel="stylesheet" href="https://gazach.my.id/style.css">
</head>
<body class="error-body">
    <main class="error-wrapper" role="main" aria-labelledby="error-title">
        <section class="error-card">
            <p class="error-code">Oops</p>
            <h1 id="error-title" class="error-title">Something went wrong</h1>
            <p class="error-message">
                The page you are looking for might have moved, no longer exists,
                or is temporarily unavailable.
            </p>

            <div class="cyber-divider" aria-hidden="true">
                <div class="cyber-progress"></div>
                <span class="scan-line"></span>
            </div>

            <div class="error-actions">
                <a class="button1" href="https://gazach.my.id/">Go Back Home</a>
                <a class="error-link" href="javascript:history.back()">Go To Previous Page</a>
            </div>
        </section>
    </main>
</body>
</html>
